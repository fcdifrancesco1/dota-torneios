<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#B5361C" />
<title>Torneios Dota 2</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <div id="topbar-title">
      <span class="logo-dot"></span>
      <h1 id="league-title">Torneios Dota 2</h1>
    </div>
    <button id="theme-toggle" aria-label="Alternar tema">🌙</button>
  </header>

  <!-- TELA: BUSCA DE TORNEIO -->
  <section id="view-search" class="view">
    <div class="search-box">
      <label for="league-search">Buscar torneio</label>
      <input id="league-search" type="text" placeholder="ex: International 2026, ESL, Riyadh Masters..." autocomplete="off" />
    </div>
    <div id="league-recent"></div>
    <ul id="league-results"></ul>
  </section>

  <!-- TELA: DASHBOARD DO TORNEIO -->
  <section id="view-dashboard" class="view hidden">
    <nav id="tabs">
      <button class="tab-btn active" data-tab="live">Ao vivo</button>
      <button class="tab-btn" data-tab="results">Resultados</button>
      <button class="tab-btn" data-tab="standings">Classificação</button>
    </nav>

    <div id="tab-live" class="tab-panel">
      <div id="live-list"></div>
    </div>

    <div id="tab-results" class="tab-panel hidden">
      <div id="results-list"></div>
    </div>

    <div id="tab-standings" class="tab-panel hidden">
      <table id="standings-table">
        <thead>
          <tr><th>#</th><th>Time</th><th>V</th><th>D</th></tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
    </div>

    <button id="btn-change-league">Trocar torneio</button>
  </section>

  <!-- TELA: DETALHE DA PARTIDA -->
  <section id="view-match" class="view hidden">
    <button id="btn-back-match">← Voltar</button>
    <div id="match-detail"></div>
  </section>

  <div id="toast"></div>
</div>

<script src="./app.js"></script>
</body>
</html>
