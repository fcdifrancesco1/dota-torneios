<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#B5361C" />
<title>Torneios Dota 2</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <div id="topbar-title">
      <span class="logo-dot"></span>
      <h1>Torneios Dota 2</h1>
    </div>
    <button id="theme-toggle" aria-label="Alternar tema">🌙</button>
  </header>

  <nav id="main-tabs">
    <button class="main-tab-btn active" data-view="torneios">Torneios</button>
    <button class="main-tab-btn" data-view="ranking">Ranking MMR</button>
  </nav>

  <div id="layout">

    <!-- COLUNA ESQUERDA: torneios -->
    <aside id="sidebar-left">
      <div class="search-box">
        <label for="league-search">Buscar torneio</label>
        <input id="league-search" type="text" placeholder="ex: International 2026, ESL..." autocomplete="off" />
      </div>
      <div id="league-recent"></div>
      <ul id="league-results"></ul>
    </aside>

    <!-- COLUNA CENTRAL -->
    <main id="center">

      <!-- estado padrão: nenhum torneio selecionado -->
      <section id="center-default">
        <h2>Próximas partidas <span id="next-league-name" class="section-sub"></span></h2>
        <div id="upcoming-list"><div class="empty-state">Carregando...</div></div>

        <h2>Últimos resultados <span id="last-league-name" class="section-sub"></span></h2>
        <div id="recent-results-list"><div class="empty-state">Carregando...</div></div>
      </section>

      <!-- estado: torneio selecionado -->
      <section id="center-league" class="hidden">
        <div id="league-header">
          <h2 id="league-title"></h2>
          <button id="btn-change-league">← Visão geral</button>
        </div>
        <nav id="tabs">
          <button class="tab-btn active" data-tab="live">Ao vivo</button>
          <button class="tab-btn" data-tab="results">Resultados</button>
        </nav>
        <div id="tab-live" class="tab-panel">
          <div id="live-list"></div>
        </div>
        <div id="tab-results" class="tab-panel hidden">
          <div id="results-list"></div>
        </div>
      </section>

    </main>

    <!-- COLUNA DIREITA: classificação -->
    <aside id="sidebar-right">
      <h2 id="standings-title">Classificação</h2>
      <div id="standings-sub" class="section-sub"></div>
      <table id="standings-table">
        <thead><tr><th>#</th><th>Time</th><th>Séries</th><th>Mapas</th></tr></thead>
        <tbody id="standings-body"></tbody>
      </table>
    </aside>

  </div>

  <!-- TELA: RANKING MMR -->
  <section id="view-ranking" class="hidden">
    <nav id="region-tabs">
      <button class="region-tab-btn" data-region="americas">Américas</button>
      <button class="region-tab-btn active" data-region="europe">Europa</button>
      <button class="region-tab-btn" data-region="china">China</button>
      <button class="region-tab-btn" data-region="se_asia">Sudeste Asiático</button>
    </nav>
    <div id="ranking-updated" class="section-sub"></div>
    <table id="ranking-table">
      <thead><tr><th>#</th><th>Jogador</th><th>País</th></tr></thead>
      <tbody id="ranking-body"></tbody>
    </table>
  </section>

  <!-- MODAL: detalhe da série -->
  <div id="series-modal" class="hidden">
    <div id="series-modal-backdrop"></div>
    <div id="series-modal-sheet">
      <button id="btn-close-series">✕</button>
      <h2 id="series-title"></h2>
      <div id="series-games"></div>
    </div>
  </div>

  <!-- MODAL: detalhe da partida -->
  <div id="match-modal" class="hidden">
    <div id="match-modal-backdrop"></div>
    <div id="match-modal-sheet">
      <button id="btn-close-match">✕</button>
      <div id="match-detail"></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="./app.js"></script>
</body>
</html>
