<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#B5361C" />
<title>Torneios Dota 2</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div id="app">

  <header id="topbar">
    <div id="topbar-title">
      <span class="logo-dot"></span>
      <h1>Torneios Dota 2</h1>
    </div>
    <button id="theme-toggle" type="button" aria-label="Alternar tema" aria-pressed="false">
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </header>

  <nav id="main-tabs" role="tablist" aria-label="Seções principais">
    <button class="main-tab-btn active" type="button" data-view="torneios" role="tab" aria-selected="true" aria-controls="layout">Torneios</button>
    <button class="main-tab-btn" type="button" data-view="ranking" role="tab" aria-selected="false" aria-controls="view-ranking">Ranking MMR</button>
    <button class="main-tab-btn" type="button" data-view="heroes" role="tab" aria-selected="false" aria-controls="view-heroes">Heróis</button>
  </nav>

  <div id="layout">

    <!-- COLUNA ESQUERDA: torneios -->
    <aside id="sidebar-left">
      <div class="search-wrap">
        <div class="search-box">
          <label for="league-search">Buscar torneio</label>
          <input id="league-search" type="text" placeholder="ex: International 2026, ESL..." autocomplete="off"
            role="combobox" aria-expanded="false" aria-controls="league-results" aria-autocomplete="list" />
        </div>
        <ul id="league-results" role="listbox"></ul>
      </div>
      <div id="league-recent"></div>
    </aside>

    <!-- COLUNA CENTRAL -->
    <main id="center">

      <!-- estado padrão: nenhum torneio selecionado -->
      <section id="center-default">
        <h2>Próximas partidas <span id="next-league-name" class="section-sub"></span></h2>
        <div id="upcoming-list"><div class="match-grid"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div></div>

        <h2>Últimos resultados <span id="last-league-name" class="section-sub"></span></h2>
        <div id="recent-results-list"><div class="match-grid"><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div></div>
      </section>

      <!-- estado: torneio selecionado -->
      <section id="center-league" class="hidden">
        <div id="league-header">
          <h2 id="league-title"></h2>
          <button id="btn-change-league" type="button">← Visão geral</button>
        </div>
        <nav id="tabs" role="tablist" aria-label="Detalhe do torneio">
          <button class="tab-btn active" type="button" data-tab="live" role="tab" aria-selected="true" aria-controls="tab-live">Ao vivo</button>
          <button class="tab-btn" type="button" data-tab="results" role="tab" aria-selected="false" aria-controls="tab-results">Resultados</button>
        </nav>
        <div id="tab-live" class="tab-panel">
          <div id="live-list"></div>
        </div>
        <div id="tab-results" class="tab-panel hidden">
          <div id="results-list"></div>
        </div>
      </section>

    </main>

    <!-- COLUNA DIREITA: classificação -->
    <aside id="sidebar-right">
      <h2 id="standings-title">Classificação</h2>
      <div id="standings-sub" class="section-sub"></div>
      <table id="standings-table">
        <thead><tr><th>#</th><th>Time</th><th>Séries</th><th>Mapas</th></tr></thead>
        <tbody id="standings-body"></tbody>
      </table>
    </aside>

  </div>

  <!-- TELA: RANKING MMR -->
  <section id="view-ranking" class="hidden">
    <nav id="region-tabs" role="tablist" aria-label="Região do ranking">
      <button class="region-tab-btn" type="button" data-region="americas" role="tab" aria-selected="false">Américas</button>
      <button class="region-tab-btn active" type="button" data-region="europe" role="tab" aria-selected="true">Europa</button>
      <button class="region-tab-btn" type="button" data-region="china" role="tab" aria-selected="false">China</button>
      <button class="region-tab-btn" type="button" data-region="se_asia" role="tab" aria-selected="false">Sudeste Asiático</button>
    </nav>
    <div id="ranking-updated" class="section-sub"></div>
    <table id="ranking-table">
      <thead><tr><th>#</th><th>Jogador</th><th>Vitórias</th><th>Posição</th><th>Heróis mais jogados</th></tr></thead>
      <tbody id="ranking-body"></tbody>
    </table>
  </section>

  <!-- TELA: HERÓIS (build por posição via STRATZ) -->
  <section id="view-heroes" class="hidden">
    <div id="heroes-layout">
      <aside id="heroes-list-wrap">
        <div class="search-box">
          <label for="hero-search">Buscar herói</label>
          <input id="hero-search" type="text" placeholder="ex: Anti-Mage..." autocomplete="off" />
        </div>
        <div id="heroes-grid"></div>
      </aside>
      <main id="hero-detail">
        <div class="empty-state">Selecione um herói pra ver a posição mais jogada e a build de itens.</div>
      </main>
    </div>
  </section>

  <!-- MODAL: detalhe da série -->
  <div id="series-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="series-title">
    <div id="series-modal-backdrop"></div>
    <div id="series-modal-sheet">
      <button id="btn-close-series" type="button" aria-label="Fechar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <h2 id="series-title"></h2>
      <div id="series-games"></div>
    </div>
  </div>

  <!-- MODAL: detalhe da partida -->
  <div id="match-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Detalhe da partida">
    <div id="match-modal-backdrop"></div>
    <div id="match-modal-sheet">
      <button id="btn-close-match" type="button" aria-label="Fechar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div id="match-detail"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script src="./app.js"></script>
</body>
</html>
