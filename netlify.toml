[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
